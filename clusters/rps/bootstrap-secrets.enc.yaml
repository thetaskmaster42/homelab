# Tailscale operator OAuth client.
#
# Create at https://login.tailscale.com/admin/settings/oauth with WRITE scope on
# all three of:
#
#   General / Services      (with tag:k8s-operator)
#   Devices / Core          (with tag:k8s-operator)
#   Keys / Auth Keys        (with tag:k8s-operator)
#
# Define the tags in your tailnet policy FIRST — the tag selector in the OAuth
# form only offers tags that already exist:
#
#   "tagOwners": {
#     "tag:k8s-operator": [],
#     "tag:k8s": ["tag:k8s-operator"]
#   }
#
# tag:k8s-operator owns tag:k8s, which is what lets the operator register the
# proxy devices it creates for each exposed Service. Full walkthrough, including
# the grant needed for API server access, is in docs/tailscale.md.
apiVersion: v1
kind: Secret
metadata:
    name: operator-oauth
    namespace: tailscale
type: Opaque
