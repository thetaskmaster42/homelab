# Template for clusters/rps/bootstrap-secrets.enc.yaml.
#
# Copy this file, fill in the real values, encrypt it, and never commit the
# plaintext:
#
#   cp clusters/rps/bootstrap-secrets.example.yaml /tmp/bs.yaml
#   $EDITOR /tmp/bs.yaml
#   sops --encrypt --filename-override clusters/rps/bootstrap-secrets.enc.yaml \
#     /tmp/bs.yaml > clusters/rps/bootstrap-secrets.enc.yaml
#   shred -u /tmp/bs.yaml
#
# --filename-override is required, not decoration: SOPS matches creation rules
# against the path you give it and looks for .sops.yaml upward from there, so
# encrypting /tmp/bs.yaml directly fails with "no matching creation rules found".
#
# Thereafter edit it in place — sops decrypts to a temp file, opens your editor,
# and re-encrypts on save, so the plaintext never touches the working tree:
#
#   sops clusters/rps/bootstrap-secrets.enc.yaml
#
# `homelab bootstrap` decrypts and applies these. They live here rather than in
# here because this repository is public and ArgoCD reads its desired state from
# git, so anything it consumes must be encrypted at rest. See
# docs/decisions/0014-sops-as-the-only-secret-manager.md.
# Grafana's admin login.
#
# kube-prometheus-stack references this instead of generating a password,
# because a chart-generated one is regenerated on every render: ArgoCD would
# rewrite it on every sync and restart Grafana each time, since the Deployment
# carries a checksum of the Secret.
