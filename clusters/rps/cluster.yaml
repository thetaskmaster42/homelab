# The single source of truth for cluster topology.
# Consumed by the `homelab` CLI (cli/). Nothing in-cluster reads this file —
# once ArgoCD is running, git is the only input. See docs/architecture.md.
apiVersion: homelab.rps/v1
kind: Cluster
metadata:
  name: rps

spec:
  ssh:
    user: rudra
    identityFile: ~/.ssh/id_ed25519
    # Connection multiplexing: 3 nodes x ~6 commands each. ControlMaster is the
    # connection pool — there is deliberately no pooling code in the CLI.
    controlPath: ~/.ssh/cm-%r@%h:%p

  k3s:
    version: v1.36.3+k3s1
    clusterCIDR: 10.42.0.0/16
    serviceCIDR: 10.43.0.0/16
    # All four flags are load-bearing.
    #
    # local-storage is deliberately NOT disabled, though it was briefly. k3s's
    # bundled local-path provisioner is what backs Prometheus, Grafana and
    # OpenBao, which must keep working when the NAS does not — see
    # docs/decisions/0008-local-disk-for-observability-and-secrets.md.
    #
    # The consequence is that k3s marks local-path as a default StorageClass and
    # we cannot stop it: the addon is a wrangler objectset (owner-gvk
    # k3s.cattle.io/v1, Kind=Addon) re-applied on every server start, so an
    # annotation flip from ArgoCD would be two controllers fighting over one
    # object. So `nfs` is default too, and TWO defaults exist. That is safe only
    # because nothing relies on the default: every PVC in this repo names its
    # class explicitly, and tests/test_apps.py fails the build if one does not.
    #
    # Two flags that USED to be here are gone, and their absence is the change:
    #
    #   --flannel-backend=none    kept flannel off so Calico could be the CNI.
    #   --disable-network-policy  turned off k3s's kube-router policy controller,
    #                             because Calico enforced NetworkPolicy instead.
    #
    # Dropping Calico means both must go, and the SECOND one matters more than it
    # looks. Six NetworkPolicies ship with the ArgoCD chart and are enforced
    # today. Removing Calico while leaving --disable-network-policy set would
    # leave those objects in the API with nothing enforcing them: no error, no
    # event, no warning — a policy that fails open and looks fine.
    # See docs/decisions/0011-flannel-over-calico.md.
    serverArgs:
      - --flannel-backend=vxlan     # k3s's bundled CNI; see cni.backend below
      - --disable=servicelb         # MetalLB provides LoadBalancer IPs
      - --disable=traefik           # Traefik is a GitOps-managed Helm chart
      - --write-kubeconfig-mode=644

  cni:
    # Flannel is started by k3s itself, so the CLI installs no CNI at all. That
    # removes the tigera operator, calico-node, typha, the calico-apiserver and
    # the CSI node driver — twelve pods and roughly 1GiB of RAM measured across
    # three nodes, on hardware where that is a real fraction of the budget.
    #
    # What is given up is Calico's policy engine and its extensions
    # (GlobalNetworkPolicy, host endpoints, eBPF dataplane), none of which this
    # cluster used. Plain NetworkPolicy still works: k3s runs kube-router for it
    # now that --disable-network-policy is gone.
    provider: flannel
    # Must match --flannel-backend in serverArgs above. vxlan for parity with
    # the encapsulation Calico was using, so exactly one thing changes here.
    backend: vxlan

  argocd:
    chartVersion: "10.4.0"
    valuesFile: argocd/bootstrap/values.yaml
    repoURL: https://github.com/thetaskmaster42/homelab.git
    revision: main
    rootApp: argocd/bootstrap/root.yaml

  network:
    # MetalLB pool. Must sit outside the Gateway Pi's DHCP scope — verify with
    # `nmap -sn 192.168.11.200-250` before the first sync.
    loadBalancerPool: 192.168.11.200-192.168.11.250
    # Traefik pins this address so it is stable across rebuilds.
    ingressIP: 192.168.11.240

  nodes:
    - name: k3s-server
      ip: 192.168.11.7
      role: server
    - name: k3s-worker-1
      ip: 192.168.11.6
      role: agent
    - name: k3s-worker-2
      ip: 192.168.11.5
      role: agent
      # Was the smallest node at ~57Gi; the card was replaced and it is now the
      # LARGEST at ~234Gi against ~115Gi on the other two. Kept as an explicit
      # false rather than deleted, because "avoid scheduling large PVCs on
      # worker-2" outlived the hardware it described and is still repeated in
      # older notes.
      #
      # It is doubly moot now: every PVC is NFS-backed on `portal`, so volume
      # size is bounded by the NAS rather than by whichever node schedules the
      # pod. Ephemeral storage — image layers, emptyDir, container logs — is
      # still node-local, and on that axis this node now has the most headroom.
      smallDisk: false
