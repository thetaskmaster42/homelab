# Template for clusters/rps/bootstrap-secrets.enc.yaml.
#
# Copy this file, fill in the real values, encrypt it, and never commit the
# plaintext:
#
#   cp clusters/rps/bootstrap-secrets.example.yaml /tmp/bs.yaml
#   $EDITOR /tmp/bs.yaml
#   sops --encrypt --filename-override clusters/rps/bootstrap-secrets.enc.yaml \
#     /tmp/bs.yaml > clusters/rps/bootstrap-secrets.enc.yaml
#   shred -u /tmp/bs.yaml
#
# --filename-override is required, not decoration: SOPS matches creation rules
# against the path you give it and looks for .sops.yaml upward from there, so
# encrypting /tmp/bs.yaml directly fails with "no matching creation rules found".
#
# Thereafter edit it in place — sops decrypts to a temp file, opens your editor,
# and re-encrypts on save, so the plaintext never touches the working tree:
#
#   sops clusters/rps/bootstrap-secrets.enc.yaml
#
# `homelab bootstrap` decrypts and applies these. They live here rather than in
# here because this repository is public and ArgoCD reads its desired state from
# git, so anything it consumes must be encrypted at rest. See
# docs/decisions/0014-sops-as-the-only-secret-manager.md.
---
# Grafana's admin login.
#
# kube-prometheus-stack references this instead of generating a password,
# because a chart-generated one is regenerated on every render: ArgoCD would
# rewrite it on every sync and restart Grafana each time, since the Deployment
# carries a checksum of the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME_use_a_generated_password
---
# Tailscale operator OAuth client.
#
# Create at https://login.tailscale.com/admin/settings/oauth with WRITE scope on
# all three of:
#
#   General / Services      (with tag:k8s-operator)
#   Devices / Core          (with tag:k8s-operator)
#   Keys / Auth Keys        (with tag:k8s-operator)
#
# Define the tags in your tailnet policy FIRST — the tag selector in the OAuth
# form only offers tags that already exist:
#
#   "tagOwners": {
#     "tag:k8s-operator": [],
#     "tag:k8s": ["tag:k8s-operator"]
#   }
#
# tag:k8s-operator owns tag:k8s, which is what lets the operator register the
# proxy devices it creates for each exposed Service. Full walkthrough, including
# the grant needed for API server access, is in docs/tailscale.md.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
type: Opaque
stringData:
  client_id: CHANGE_ME_tailscale_oauth_client_id
  client_secret: CHANGE_ME_tailscale_oauth_client_secret
---
# Journiv's SECRET_KEY.
#
# Signs JWTs and encrypts at-rest fields, so it must be STABLE: regenerating it
# logs everybody out and voids any password-reset token in flight. It does not
# void accounts.
#
# It is here rather than generated by an operator because nothing generates it —
# unlike CloudNativePG, which makes Journiv's database password for us and is why
# no Postgres credential appears in this bundle. See
# docs/decisions/0017-journiv.md.
#
# Nobody ever needs to read this value, so do not choose one:
#
#   openssl rand -base64 32
#
# The `journiv` namespace does not have to exist first — `homelab bootstrap`
# creates every namespace named in this bundle before applying it.
apiVersion: v1
kind: Secret
metadata:
  name: journiv-app-secret
  namespace: journiv
type: Opaque
stringData:
  secret-key: CHANGE_ME_use_openssl_rand_base64_32
