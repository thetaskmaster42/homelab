[project]
name = "homelab"
version = "0.1.0"
description = "Builds the k3s cluster from clusters/<name>/cluster.yaml, and stops the moment ArgoCD is running."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
homelab = "homelab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
