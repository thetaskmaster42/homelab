crds:
  # cert-manager's CRDs must exist before the ClusterIssuers in manifests/ can
  # apply. The companion Application retries until they do.
  enabled: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

webhook:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

cainjector:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
