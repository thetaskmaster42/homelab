# OpenBao — runtime secret manager for applications.
#
# This does NOT replace SOPS+age, and the two solve different problems:
#
#   SOPS+age  encrypts secrets that must live IN GIT, because ArgoCD reads its
#             desired state from git. Bootstrap credentials only.
#   OpenBao   stores secrets that applications fetch AT RUNTIME, so they are
#             never committed anywhere, can be rotated without a deploy, and can
#             be issued dynamically (e.g. short-lived Postgres credentials).
#
# The chart's injector mutates annotated pods to pull secrets in as files, so an
# application needs no OpenBao client library to consume them.
#
# Operationally important: OpenBao starts SEALED after every restart and must be
# unsealed before it serves anything. There is no cloud KMS here to auto-unseal
# against, so that step is manual — see docs/runbooks/openbao-unseal.md. The
# unseal keys are the one thing that can never be stored in this repo, nor in
# OpenBao itself.
name: openbao
namespace: openbao
extraManifests: "false"
chart:
  repo: https://openbao.github.io/openbao-helm
  name: openbao
  version: "0.29.1"
