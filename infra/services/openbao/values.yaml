server:
  # Single node, but on RAFT rather than the `file` backend, and the reason is
  # backups rather than high availability.
  #
  # The file backend has no snapshot API at all: the only way to back it up is
  # to copy the PVC out of band, with the process running and no consistency
  # guarantee. Raft gives `bao operator raft snapshot save|restore`, which is a
  # real backup story for the one component whose loss cannot be reconstructed
  # from git.
  #
  # This MUST be decided before `bao operator init`. Changing the storage
  # backend afterwards means re-initialising: new unseal keys, new root token,
  # and every secret re-seeded. It is free right now precisely because the store
  # is still empty.
  #
  # replicas stays 1. Raft across three Pis is the obvious next step, but it
  # triples the unseal ceremony for a homelab with one operator, and HA is not
  # what this change is for. Single-node raft keeps one unseal and one pod while
  # still giving snapshots.
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      # Node ID from the pod name, so a rescheduled pod rejoins as itself rather
      # than appearing as a new peer to the raft log.
      setNodeId: true

    disruptionBudget:
      # Disabled, and NOT because disruption budgets are unwanted.
      #
      # The chart hardcodes maxUnavailable to 0 whenever replicas is 1:
      #
      #   {{- if eq (int .Values.server.ha.replicas) 1 -}}{{ 0 }}
      #   {{- else if .Values.server.ha.disruptionBudget.maxUnavailable -}}
      #
      # The override is only reached in the `else if`, so it cannot be set at
      # this replica count. maxUnavailable 0 means NO voluntary eviction is ever
      # permitted, and `kubectl drain` on whichever node holds this pod would
      # hang forever -- the wrong property for a cluster whose nodes have needed
      # maintenance twice this week.
      #
      # With one replica there is no availability for a budget to protect, so
      # its only effect is to block drain. Re-enable this if replicas ever go to
      # 3, where the chart WILL honour maxUnavailable and 1 preserves raft
      # quorum at 2 of 3.
      enabled: false

  dataStorage:
    enabled: true
    size: 2Gi
    # local-path, and this restores the original choice after a spell on NFS.
    # The original reasoning was right: the secret store is the last thing that
    # should depend on the NAS being reachable, and the file backend wants local
    # fsync semantics.
    #
    # The specific failure that sent it back is a recovery deadlock. Under `hard`
    # mounts a NAS outage blocks OpenBao rather than corrupting it -- but a
    # blocked OpenBao means the injector cannot render secrets, so no new pod
    # that needs an injected secret can start. The outage stops being something
    # you can deploy your way out of. See
    # docs/decisions/0008-local-disk-for-observability-and-secrets.md.
    #
    # Node-pinning is acceptable because this volume is reconstructible: losing
    # it costs a re-initialise and a re-seed from the SOPS-encrypted bootstrap
    # bundle, not lost secrets. Treat it as a cache of unsealed state, not the
    # system of record.
    storageClass: local-path
    accessMode: ReadWriteOnce

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

  # Reached over the tailnet via an Ingress, not published on the LAN.
  service:
    type: ClusterIP

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  # Mutates annotated pods to render secrets to a file in a shared volume, so
  # applications consume secrets without an OpenBao client library:
  #   bao.openbao.org/agent-inject: "true"
  #   bao.openbao.org/role: "<role>"
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

csi:
  # The injector covers the need; the CSI provider is a second mechanism doing
  # the same job. Enable only if a workload cannot take an injected file.
  enabled: false
