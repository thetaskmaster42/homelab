server:
  # Single node with file storage. HA raft across three Pis is the obvious next
  # step, but it triples the unseal ceremony for a homelab with one operator —
  # revisit once auto-unseal exists (see the note in service.yaml).
  standalone:
    enabled: true

  dataStorage:
    enabled: true
    size: 2Gi
    # nfs, because it is now the only StorageClass -- k3s runs with
    # --disable=local-storage. This reverses the earlier choice here, and the
    # earlier reasoning was not wrong: the secret store is the last thing that
    # should depend on the NAS being reachable, and the file backend wants local
    # fsync semantics. Under `hard` mounts a NAS outage does not corrupt the
    # store, it blocks it -- OpenBao hangs rather than losing data, and the pod
    # recovers when `portal` returns.
    #
    # What makes that acceptable is the recovery plan, which has not changed:
    # this volume is reconstructible. Losing it costs a re-initialise and a
    # re-seed, not lost secrets, because the seeds come from the SOPS-encrypted
    # bootstrap bundle in git. Treat it as a cache of unsealed state, not as the
    # system of record.
    storageClass: nfs
    accessMode: ReadWriteOnce

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

  # Reached over the tailnet via an Ingress, not published on the LAN.
  service:
    type: ClusterIP

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  # Mutates annotated pods to render secrets to a file in a shared volume, so
  # applications consume secrets without an OpenBao client library:
  #   bao.openbao.org/agent-inject: "true"
  #   bao.openbao.org/role: "<role>"
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

csi:
  # The injector covers the need; the CSI provider is a second mechanism doing
  # the same job. Enable only if a workload cannot take an injected file.
  enabled: false
