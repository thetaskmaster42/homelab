# Dynamic PersistentVolumes backed by the `portal` NAS. The default class for
# application data; k3s's local-path sits alongside it for the two workloads
# that must survive a NAS outage (ADR 0008).
#
# This exists to solve node-pinning, not capacity. The built-in `local-path`
# StorageClass binds a volume to whichever node first scheduled its pod, and
# that pod can then never move — it cannot be rescheduled if the node dies, and
# `homelab nuke` destroys the data outright. Adding a bigger card to a node
# raises its ceiling but changes none of that.
#
# Application data lands here -- cloudnative-pg, prep-tracker's database,
# rh-dashboard -- because it is the data that is not reconstructible and that
# `homelab nuke` must not be able to erase. The monitoring stack deliberately
# does NOT: its state is reconstructible, and it is precisely what must keep
# working when the NAS does not. That split is argued in
# docs/decisions/0008-local-disk-for-observability-and-secrets.md.
#
# The cost of everything else being here is concentration: this Application and
# the `portal` NAS behind it are a single point of failure for all application
# state.
#
# The retry-driven ordering in argocd/registry/ is what makes that survivable at
# sync time — a PVC on a class whose provisioner is not up yet simply stays
# Pending until it is. It does nothing for a NAS that goes away at runtime.
name: nfs-provisioner
namespace: storage
extraManifests: "false"
chart:
  repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  name: nfs-subdir-external-provisioner
  version: "4.0.18"
