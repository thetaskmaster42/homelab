# The database behind Docmost.
#
# A dedicated cluster rather than a database inside the shared one in
# `databases`, matching prep-tracker: Docmost needs two PostgreSQL extensions
# installed into its own database, and doing that to the shared cluster would
# make every other application carry them too.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: docmost-db
  namespace: docmost
spec:
  instances: 2

  # nfs, like every other database here. Wiki pages are not reconstructible from
  # anything, and `homelab nuke` erases local-path outright -- which would make
  # the routine rebuild drill destroy the content this app exists to hold.
  # See docs/decisions/0008-local-disk-for-observability-and-secrets.md.
  #
  # The cost is unchanged from the shared cluster: both instances write to
  # `portal`, so replication covers a lost NODE but not lost storage. Backups to
  # a target that is not portal remain the outstanding gap, and they matter more
  # here than anywhere else in this cluster.
  storage:
    size: 8Gi
    storageClass: nfs

  postgresql:
    parameters:
      shared_buffers: 128MB
      effective_cache_size: 512MB
      max_connections: "100"
      work_mem: 4MB

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

  # required, not preferred. CloudNativePG defaults enablePodAntiAffinity to a
  # SOFT rule, which quietly stops applying under scheduling pressure -- and
  # since both volumes are on the same NAS, node separation is the only
  # protection left. 2 instances across 3 nodes is comfortably satisfiable.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: docmost
      owner: docmost
      # Docmost REQUIRES both extensions -- its search and migrations depend on
      # them, and it fails on first start without them. The chart's bundled
      # Postgres installs them in an initdb script; CloudNativePG does not know
      # about that, so they are declared here instead. This is the single
      # easiest thing to miss when swapping the bundled database for CNPG.
      #
      # postInitApplicationSQL runs as superuser inside the freshly created
      # application database, which is exactly the privilege CREATE EXTENSION
      # needs and the `docmost` role does not have.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS unaccent;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
      # Credentials are generated by the operator into docmost-db-app rather
      # than set here, because this repo is public. values.yaml points the chart
      # at that Secret.
