# The OAuth client is NOT set here — it lives in the `operator-oauth` Secret,
# applied at bootstrap from an encrypted file so no credential ever reaches this
# public repo in plaintext.
oauth:
  clientId: ""
  clientSecret: ""

operatorConfig:
  hostname: rps-k8s-operator
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

# Devices the operator creates are tagged so tailnet ACLs can reason about them.
# Both tags must exist in the tailnet policy file before the operator starts, or
# device registration fails with a permission error.
proxyConfig:
  defaultTags: "tag:k8s"

apiServerProxyConfig:
  # Exposes the Kubernetes API over the tailnet, so kubectl works off-LAN with
  # no VPN and no port forward.
  mode: "true"
  # Without this the proxy forwards every request using the OPERATOR's identity,
  # so anyone who can reach it on the tailnet inherits the operator's
  # permissions. With it, the proxy sets impersonation headers from the caller's
  # Tailscale identity, and access is governed by a tailnet grant plus ordinary
  # Kubernetes RBAC.
  #
  # Requires a grant in the tailnet policy mapping users to Kubernetes groups —
  # see docs/tailscale.md. Without that grant nobody can reach the API at all,
  # which is the correct failure direction.
  allowImpersonation: "true"
