# Tuned for three Raspberry Pis, not a datacentre.
#
# Storage is the binding constraint, not memory. Both PVCs below are now on the
# `nfs` class, so they are no longer pinned to whichever node first scheduled
# them and no longer bounded by k3s-worker-2's ~57Gi. Retention and volume sizes
# stay small anyway: they are now bounded by the `portal` NAS, which is one
# 4GB Pi serving the whole cluster.
#
# Read the upstream warning before raising these. Prometheus documents NFS as
# unsupported for its local TSDB -- it relies on POSIX semantics most NFS
# implementations only approximate, and the documented failure mode is silent,
# unrecoverable block corruption rather than a clean error. 7d/8GB keeps the
# cost of rebuilding from empty low, because rebuilding from empty is the
# recovery plan. See docs/decisions/0006-nfs-default-storage.md.

grafana:
  # Without this the chart generates a fresh random admin password on EVERY
  # render. ArgoCD re-renders on every refresh, so under automated + selfHeal it
  # would rewrite the Secret and restart Grafana continuously — the deployment
  # annotation carries a checksum of the Secret, so the pod churns too.
  # tests/test_render_determinism.py catches this class of bug.
  #
  # The referenced Secret is created at bootstrap, not by this chart; see
  # docs/bootstrap.md. It must exist before this Application syncs.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Reached over the tailnet, not a NodePort. The old 30000-30002 NodePorts are
  # retired — they were the only way in before Tailscale existed.
  service:
    type: ClusterIP

  ingress:
    enabled: true
    # Tailnet only. Grafana has real authentication of its own (the
    # grafana-admin Secret), so this is defence in depth rather than the only
    # control — unlike Headlamp, where the tailnet is the whole story. Still not
    # funneled: dashboards leak a great deal about what runs here.
    ingressClassName: tailscale
    hosts:
      - grafana
    tls:
      - hosts:
          - grafana

  # Grafana builds absolute URLs for redirects, share links and OAuth callbacks
  # from root_url. Left at its default it emits http://localhost:3000 links,
  # which break the moment anything redirects — most visibly on login.
  grafana.ini:
    server:
      root_url: https://grafana.mongoose-galaxy.ts.net

  persistence:
    enabled: true
    # Grafana's own state is a small SQLite file, which is the one thing here
    # that NFS handles badly for a benign reason rather than a corrupting one:
    # SQLite needs working file locks. nfsvers=4.1 provides them natively (v4
    # locking is in-protocol, no rpc.statd), so this is safe where a v3 mount
    # would not be. Dashboards are provisioned from ConfigMaps regardless, so
    # the blast radius of losing this volume is saved preferences.
    storageClassName: nfs
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          # RWO even though the nfs class can serve RWX. Prometheus must never
          # have two writers against one TSDB, and RWO is what stops a second
          # pod mounting it during a rolling update.
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

# k3s runs the scheduler, controller-manager, proxy and datastore inside a single
# process rather than as separately-scrapeable components. Leaving these enabled
# produces permanently-down targets and firing watchdog alerts that train you to
# ignore the alert list.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
