# Tuned for three Raspberry Pis, not a datacentre.
#
# Storage is the binding constraint, not memory.
#
# BOTH volumes below are on local-path, after a spell on NFS. The reason is in
# docs/decisions/0008-local-disk-for-observability-and-secrets.md: under `hard`
# NFS mounts a NAS outage blocks the TSDB write path, scrapes pile up in memory
# until the pod is OOMKilled, and the unclean restart replays a WAL that upstream
# explicitly says NFS may have corrupted. Worse, this stack IS the alerting --
# putting it on the NAS means a NAS failure silences the system that would have
# told you about it, and blanks the dashboards you would look at next.
#
# Node-pinning is the price, and it is the right one here: metrics are the most
# disposable data in the cluster. The recovery plan for a lost node is to start
# from empty, which is also why retention stays at 7d/8GB.

grafana:
  # Without this the chart generates a fresh random admin password on EVERY
  # render. ArgoCD re-renders on every refresh, so under automated + selfHeal it
  # would rewrite the Secret and restart Grafana continuously — the deployment
  # annotation carries a checksum of the Secret, so the pod churns too.
  # tests/test_render_determinism.py catches this class of bug.
  #
  # The referenced Secret is created at bootstrap, not by this chart; see
  # docs/bootstrap.md. It must exist before this Application syncs.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Reached over the tailnet, not a NodePort. The old 30000-30002 NodePorts are
  # retired — they were the only way in before Tailscale existed.
  service:
    type: ClusterIP

  ingress:
    enabled: true
    # Tailnet only. Grafana has real authentication of its own (the
    # grafana-admin Secret), so this is defence in depth rather than the only
    # control — unlike Headlamp, where the tailnet is the whole story. Still not
    # funneled: dashboards leak a great deal about what runs here.
    ingressClassName: tailscale
    hosts:
      - grafana
    tls:
      - hosts:
          - grafana

  # Grafana builds absolute URLs for redirects, share links and OAuth callbacks
  # from root_url. Left at its default it emits http://localhost:3000 links,
  # which break the moment anything redirects — most visibly on login.
  grafana.ini:
    server:
      root_url: https://grafana.mongoose-galaxy.ts.net

  persistence:
    enabled: true
    # local-path, for the same reason as Prometheus: the monitoring stack must
    # not depend on the thing it is most needed to report on. Grafana's SQLite
    # file would survive NFS fine on its own -- nfsvers=4.1 gives it real
    # in-protocol locking -- but surviving is not the point. A NAS outage that
    # left Prometheus scraping while Grafana could not render would leave you
    # partly blind exactly when you need to look.
    #
    # Losing this volume is cheap: dashboards are provisioned from ConfigMaps and
    # the admin credential comes from the grafana-admin Secret at bootstrap, so
    # what is actually stored here is saved preferences.
    storageClassName: local-path
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Explicit, never inherited. Two default StorageClasses exist in this
          # cluster (see clusters/rps/cluster.yaml), so an omitted class is
          # non-deterministic rather than merely implicit.
          storageClassName: local-path
          # RWO is what local-path gives anyway, but state it: Prometheus must
          # never have two writers against one TSDB.
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

# k3s runs the scheduler, controller-manager, proxy and datastore inside a single
# process rather than as separately-scrapeable components. Leaving these enabled
# produces permanently-down targets and firing watchdog alerts that train you to
# ignore the alert list.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
