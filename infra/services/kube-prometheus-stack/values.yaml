# Tuned for three Raspberry Pis, not a datacentre.
#
# Storage is the binding constraint, not memory: k3s-worker-2 has ~57Gi ephemeral
# storage against ~115Gi on the other two, and local-path PVs are node-pinned.
# Retention and volume sizes are therefore deliberately small. Once the NFS
# provisioner is in place, move these PVCs to storageClassName: nfs so they stop
# being pinned to whichever node first scheduled them.

grafana:
  # Without this the chart generates a fresh random admin password on EVERY
  # render. ArgoCD re-renders on every refresh, so under automated + selfHeal it
  # would rewrite the Secret and restart Grafana continuously — the deployment
  # annotation carries a checksum of the Secret, so the pod churns too.
  # tests/test_render_determinism.py catches this class of bug.
  #
  # The referenced Secret is created at bootstrap, not by this chart; see
  # docs/bootstrap.md. It must exist before this Application syncs.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Reached over the tailnet, not a NodePort. The old 30000-30002 NodePorts are
  # retired — they were the only way in before Tailscale existed.
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

# k3s runs the scheduler, controller-manager, proxy and datastore inside a single
# process rather than as separately-scrapeable components. Leaving these enabled
# produces permanently-down targets and firing watchdog alerts that train you to
# ignore the alert list.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
