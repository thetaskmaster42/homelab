# Central PostgreSQL for applications, via the CloudNativePG operator.
#
# The chart installs only the operator and its CRDs. The actual database is a
# `Cluster` custom resource in manifests/, which is why this uses the two-part
# pattern — the CR cannot apply until the CRD the chart brings exists.
#
# An operator rather than a plain postgres chart because replication, failover,
# backups and rolling minor upgrades are the interesting parts of running a
# database, and CloudNativePG models them as Kubernetes primitives instead of
# hiding them in a StatefulSet.
name: cloudnative-pg
namespace: cnpg-system
extraManifests: "true"
chart:
  repo: https://cloudnative-pg.github.io/charts
  name: cloudnative-pg
  version: "0.29.0"
