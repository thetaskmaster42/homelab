# The database lives in its own namespace, separate from the operator's. The
# operator is infrastructure that could be replaced; the data is not. Declared
# here explicitly because the companion Application's CreateNamespace only
# covers its own destination namespace (cnpg-system).
apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
# The shared PostgreSQL cluster applications use.
#
# Applications do not each run their own database. They get a database and a
# role inside this one, and reach it at:
#   postgres-rw.databases.svc.cluster.local:5432   (primary, read-write)
#   postgres-ro.databases.svc.cluster.local:5432   (replicas, read-only)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 2

  # nfs. This reverses the original choice, and the original argument still
  # holds on its own terms: CloudNativePG gets durability from streaming
  # replication between instances on different nodes, not from shared storage,
  # and PostgreSQL's fsync guarantees are what NFS is worst at. Read the two
  # costs before touching this.
  #
  # 1. Correlated failure. Both instances now write to the same NAS, so the
  #    anti-affinity below no longer buys what it used to: it still survives a
  #    lost NODE, but `portal` going away takes down primary and replica
  #    together. Physical replication protects against node loss, not against
  #    the storage under both copies.
  # 2. fsync honesty. Postgres assumes a completed fsync means durable. An NFS
  #    server that buffers writes can violate that across a power cut, and
  #    Postgres has no way to detect it -- the damage surfaces later as a
  #    corrupt page. `hard` mounts turn a NAS outage into a hang rather than an
  #    error, which is the failure mode Postgres survives; a power cut on
  #    `portal` mid-write is the one it does not.
  #
  # What makes this survivable is barman backups to a SEPARATE target, which do
  # not exist yet. Until they do, this cluster's recovery story is "reinitialise
  # empty". See docs/decisions/0006-nfs-default-storage.md.
  storage:
    size: 10Gi
    storageClass: nfs

  postgresql:
    parameters:
      # Tuned for a Raspberry Pi, not a server. These are the four that actually
      # matter at this scale.
      shared_buffers: 128MB
      effective_cache_size: 512MB
      max_connections: "100"
      work_mem: 4MB

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

  # Keep the primary and its replica on different nodes.
  #
  # podAntiAffinityType is set explicitly because CNPG defaults it to
  # `preferred`, and `enablePodAntiAffinity: true` alone therefore renders a
  # SOFT constraint -- the scheduler tries to separate the instances but will
  # co-locate both on one node under pressure, silently. Verified against the
  # live pod spec: it produced preferredDuringSchedulingIgnoredDuringExecution.
  #
  # That was tolerable while the volumes were node-local, because a co-located
  # pair still held two independent copies on two disks. It is not tolerable
  # now: both instances write to the same NAS, so node separation is the ONLY
  # remaining protection against correlated failure. A soft rule that quietly
  # stops applying is worse than no rule, because the topology still looks
  # right in `kubectl get pods` right up until the moment it doesn't.
  #
  # `required` is safely satisfiable here -- 2 instances across 3 nodes. If a
  # node is down the replica still schedules on the third. If two are down it
  # stays Pending, which is the correct answer rather than a false comfort.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: app
      owner: app
      # Credentials are generated by the operator into a Secret rather than set
      # here — this repo is public. Retrieve with:
      #   kubectl -n databases get secret postgres-app -o jsonpath='{.data.password}' | base64 -d
      # Longer term these move to OpenBao's database secrets engine, which issues
      # short-lived per-application roles instead of one static password.
