# The database lives in its own namespace, separate from the operator's. The
# operator is infrastructure that could be replaced; the data is not. Declared
# here explicitly because the companion Application's CreateNamespace only
# covers its own destination namespace (cnpg-system).
apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
# The shared PostgreSQL cluster applications use.
#
# Applications do not each run their own database. They get a database and a
# role inside this one, and reach it at:
#   postgres-rw.databases.svc.cluster.local:5432   (primary, read-write)
#   postgres-ro.databases.svc.cluster.local:5432   (replicas, read-only)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  instances: 2

  # local-path, NOT the nfs StorageClass, and this is deliberate. CloudNativePG
  # achieves durability through streaming replication between instances on
  # different nodes, not through shared storage — and PostgreSQL's fsync
  # guarantees are exactly what NFS is worst at. Node-pinning is fine here
  # because a lost node is handled by failover to the replica, not by moving a
  # volume.
  storage:
    size: 10Gi
    storageClass: local-path

  postgresql:
    parameters:
      # Tuned for a Raspberry Pi, not a server. These are the four that actually
      # matter at this scale.
      shared_buffers: 128MB
      effective_cache_size: 512MB
      max_connections: "100"
      work_mem: 4MB

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }

  # Keep the primary and its replica on different nodes, or the replica provides
  # no protection against the failure it exists to survive.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: app
      owner: app
      # Credentials are generated by the operator into a Secret rather than set
      # here — this repo is public. Retrieve with:
      #   kubectl -n databases get secret postgres-app -o jsonpath='{.data.password}' | base64 -d
      # Longer term these move to OpenBao's database secrets engine, which issues
      # short-lived per-application roles instead of one static password.
