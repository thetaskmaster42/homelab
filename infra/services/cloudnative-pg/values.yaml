# Operator only. The database itself is manifests/cluster.yaml.
crds:
  create: true

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

monitoring:
  # Ships a PodMonitor for the operator and for every Cluster it manages, picked
  # up automatically by kube-prometheus-stack.
  podMonitorEnabled: true
  grafanaDashboard:
    create: true
    namespace: monitoring
