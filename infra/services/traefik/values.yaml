service:
  spec:
    type: LoadBalancer
    # Pinned so the LAN ingress address survives a nuke-and-rebuild and can be
    # written into /etc/hosts or a future DNS record. Must be inside the MetalLB
    # pool declared in infra/services/metallb/manifests/ipaddresspool.yaml.
    loadBalancerIP: 192.168.11.240

ports:
  web:
    http:
      # Everything reaching Traefik on the LAN gets pushed to TLS. Services
      # exposed over Tailscale terminate at the tailnet and never traverse this
      # entrypoint at all.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true

ingressRoute:
  dashboard:
    # The dashboard is reached over the tailnet, not published on the LAN.
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }
