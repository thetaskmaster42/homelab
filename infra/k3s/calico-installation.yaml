# Calico Installation CR, applied by server.sh after the Tigera operator.
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
    ipPools:
      # Matches the k3s default --cluster-cidr
      - cidr: 10.42.0.0/16
        encapsulation: VXLAN
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
