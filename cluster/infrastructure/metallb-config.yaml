apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thetaskmaster42/homelab.git
    targetRevision: main
    path: cluster/infrastructure/metallb-config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The IPAddressPool CRD only exists once the metallb app is synced
    retry:
      limit: -1
      backoff:
        duration: 30s
        maxDuration: 5m
