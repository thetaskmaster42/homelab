# ClusterIssuer backed by the step-ca LXC container (see infra/step-ca/).
# cert-manager talks ACME to step-ca's ACME provisioner.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    # TODO: confirm step-ca hostname + port and the ACME provisioner name
    # (default provisioner name below is "acme":
    #   step ca provisioner add acme --type ACME)
    server: https://step-ca.rps-home.com/acme/acme/directory
    # step-ca's root certificate, base64-encoded, so cert-manager trusts it:
    #   base64 -w0 $(step path)/certs/root_ca.crt
    # TODO: paste the value
    caBundle: ""
    privateKeySecretRef:
      name: step-ca-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
