apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thetaskmaster42/homelab.git
    targetRevision: main
    path: cluster/infrastructure/cert-manager-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The ClusterIssuer CRD only exists once the cert-manager app is synced
    retry:
      limit: -1
      backoff:
        duration: 30s
        maxDuration: 5m
