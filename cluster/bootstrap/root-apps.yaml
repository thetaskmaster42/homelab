apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thetaskmaster42/homelab.git
    targetRevision: main
    path: cluster/infrastructure
    # Top level only: subdirectories hold raw manifests owned by their own
    # Application (e.g. metallb-config/), not by this root app.
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thetaskmaster42/homelab.git
    targetRevision: main
    path: cluster/apps
    # Top level only: subdirectories hold raw manifests owned by their own
    # Application (e.g. metallb-config/), not by this root app.
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
