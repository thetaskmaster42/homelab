# ArgoCD Helm values (chart: argo-cd).
#
# Applied by `homelab bootstrap`, which runs `helm upgrade --install`. ArgoCD
# does NOT manage itself — there is no Application for it — so a change here
# takes effect only when bootstrap is re-run, not on push. That command is
# idempotent and safe to repeat, which is also why it doubles as break-glass
# recovery when ArgoCD has broken its own ability to sync.

# Used for the redirect/callback URL ArgoCD advertises (argocd-cm `url`). Left
# unset, ArgoCD emits links to localhost, which break as soon as anything
# redirects — the same trap as Grafana's root_url.
global:
  domain: argocd.mongoose-galaxy.ts.net

configs:
  params:
    # TLS terminates at Traefik (LAN) and at Tailscale (tailnet), so the API
    # server runs plain inside the cluster. Required for the ingress below:
    # without it argocd-server serves HTTPS itself and the proxy in front sees a
    # TLS-on-TLS mismatch, which surfaces as a redirect loop.
    server.insecure: true

# 3x Raspberry Pi 16GB, all arm64. argo-cd images are multi-arch, no pinning
# needed. Requests are set so the scheduler can reason about the Pis rather
# than treating ArgoCD as free.
controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

server:
  ingress:
    enabled: true
    # Tailnet only, and never funneled. ArgoCD has its own login, but it holds
    # sync control over every service in the cluster — the tailnet is the
    # boundary that matters.
    ingressClassName: tailscale
    # Short name: the Tailscale operator appends the tailnet suffix itself, the
    # same way grafana and headlamp are configured.
    hostname: argocd
    tls: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# LAN Ingress for the ArgoCD UI, alongside the tailnet one configured above.
#
# Why extraObjects and not a second `server.ingress`: that block renders exactly
# one Ingress with one class, and the LAN one needs `traefik` plus the homelab-ca
# issuer. Why here and not a manifest under argocd/: ArgoCD is installed by
# `homelab bootstrap` via Helm, not by an ApplicationSet, so this file is the
# only place its own resources are defined. Changing it means re-running
# bootstrap -- which is idempotent, and already true of everything else here.
#
# SECURITY, read before copying this pattern: the tailnet Ingress above is
# deliberately tailnet-only because ArgoCD holds sync control over every service
# in the cluster. This widens that boundary to anything on 192.168.11.0/24 --
# guest devices and IoT included. It is defensible because ArgoCD authenticates
# (headlamp, which does not, is deliberately NOT given a LAN Ingress), but it is
# a real change in exposure rather than a formality. Remove this block to revert.
#
# KNOWN LIMITATION, same shape as Grafana's root_url: `global.domain` above is a
# single absolute URL pinned to the tailnet name. The UI works on relative paths
# so browsing is fine, but anything ArgoCD emits as an absolute link points at
# argocd.mongoose-galaxy.ts.net. Split-horizon DNS on the Pi-hole is the fix.
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: argocd-server-lan
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
    spec:
      ingressClassName: traefik
      rules:
        - host: argocd.rps-home.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: argocd-server
                    # Port 80, not 443: `server.insecure: true` above makes
                    # argocd-server speak plain HTTP inside the cluster. Pointing
                    # Traefik at 443 would be TLS-on-TLS and surface as a
                    # redirect loop.
                    port:
                      number: 80
      tls:
        - hosts:
            - argocd.rps-home.com
          secretName: argocd-lan-tls
