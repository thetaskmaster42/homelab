# Two AppProjects enforce the infra/app segregation at the RBAC layer, not just
# by directory convention. An application can never accidentally install a
# cluster-scoped CRD, and infra can never be sourced from a random repo.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: Cluster infrastructure. Helm charts only.
  sourceRepos:
    - https://github.com/thetaskmaster42/homelab.git
    # Upstream chart repositories. Add one line per new chart source.
    - https://metallb.github.io/metallb
    - https://charts.jetstack.io
    - https://traefik.github.io/charts
    - https://pkgs.tailscale.com/helmcharts
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
    - https://openbao.github.io/openbao-helm
    - https://cloudnative-pg.github.io/charts
    - https://kubernetes-sigs.github.io/headlamp
    # The only community-maintained source here rather than a vendor's own.
    # Docmost publishes no official chart; HelmForge's is the one actively
    # tracking it, and it is GPG+cosign signed. See ADR 0010.
    - https://repo.helmforge.dev
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  # Infra legitimately installs CRDs, ClusterRoles and namespaces.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Homebuilt applications. Source may live in external repos.
  sourceRepos:
    - 'https://github.com/thetaskmaster42/*'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  # Applications may not install CRDs, ClusterRoles or anything else
  # cluster-scoped — if an app needs one it is infrastructure, and belongs in
  # infra/services/. Namespace is the single exception: appset-apps sets
  # CreateNamespace=true, and a Namespace is itself a cluster-scoped resource,
  # so an empty whitelist blocks every app from ever being created.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
