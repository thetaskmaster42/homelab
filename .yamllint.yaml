extends: default

rules:
  # Helm values and ArgoCD manifests routinely exceed 80 columns, and wrapping
  # them hurts readability more than the long line does.
  line-length:
    max: 120
    level: warning
  # `on:` in workflows and `true`/`false` as chart values are both fine.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  # Most files here are Helm values or a single manifest; a leading `---` adds
  # nothing. Multi-document files still use it as a separator.
  document-start: disable
  # Templated ApplicationSet YAML uses {{ }} at the start of values.
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  .github/
