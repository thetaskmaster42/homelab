apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rh-dashboard

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - ingress.yaml

images:
  # Pinned, never `latest` — a floating tag makes rollback impossible and hides
  # what is running.
  #
  # The IMAGE tag has no leading `v`, even though the git tag does:
  # release.yml derives it with `${GITHUB_REF_NAME#v}`, so pushing git tag
  # v1.0.1 publishes ghcr.io/.../rh-dashboard:1.0.1. Pinning "v1.0.1" here
  # resolves to nothing and the pod sits in ImagePullBackOff.
  - name: ghcr.io/thetaskmaster42/rh-dashboard
    newTag: "1.0.2"
