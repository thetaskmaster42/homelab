# LAN access, alongside the tailnet Ingress rather than instead of it. Both
# resolve to the same Service; which one you reach depends on where you are.
#
#   tailnet   rh-dashboard.mongoose-galaxy.ts.net   real Let's Encrypt cert, from anywhere
#   LAN       rh-dashboard.rps-home.com             homelab-ca cert, 192.168.11.240 only
#
# See docs/decisions/0016-lan-ingress.md -- in particular the one-time step of
# trusting the homelab-ca root on every device that will browse these.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rh-dashboard-lan
  annotations:
    # cert-manager issues the leaf from the local CA. Without this the tls block
    # names a Secret nothing creates, and Traefik falls back to its own default
    # self-signed cert -- a working site with an inexplicable certificate.
    cert-manager.io/cluster-issuer: homelab-ca
spec:
  # NOT the default class, even though `traefik` IS the cluster default. Naming
  # it makes the pairing with the tailnet Ingress obvious in `kubectl get ing`,
  # and means a change to the default cannot silently redirect this.
  ingressClassName: traefik
  rules:
    - host: rh-dashboard.rps-home.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rh-dashboard
                port:
                  number: 8080
  tls:
    - hosts:
        - rh-dashboard.rps-home.com
      secretName: rh-dashboard-lan-tls
