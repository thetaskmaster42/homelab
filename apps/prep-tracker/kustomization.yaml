apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interview

resources:
  # The app repo owns its own manifests; this overlay only pins, orders and
  # exposes them. Every file is pinned to a commit sha, so a push to the app repo
  # cannot silently change what runs here — bumping these refs IS the deploy.
  #
  # These move together with the image tag even when k8s/ is untouched, so the
  # overlay always describes one build rather than an image from one commit and
  # manifests from another. At 45e502b the change is UI-only (a favicon), and
  # `kubectl kustomize` renders byte-identically to 80a06c8 — verified, not
  # assumed. The previous bump was the SQLite -> PostgreSQL move, where the set
  # of files changed too, and bumping only the tag would have run the new image
  # against manifests with no DATABASE_URL.
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/45e502bcb2c675646cda02841833c658e1aff523/k8s/deployment.yaml
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/45e502bcb2c675646cda02841833c658e1aff523/k8s/service.yaml
  # CloudNativePG Cluster "prep-tracker-db" — the app runs its own database
  # rather than using the shared cluster in the databases namespace.
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/45e502bcb2c675646cda02841833c658e1aff523/k8s/postgres-cluster.yaml
  # `alembic upgrade head`. RUN_MIGRATIONS_ON_STARTUP is false in the Deployment
  # precisely so the two replicas cannot race each other on migration.
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/45e502bcb2c675646cda02841833c658e1aff523/k8s/migrate-job.yaml
  - ingress.yaml

images:
  # The base ships `:latest` with imagePullPolicy: Always, which means you can
  # neither roll back nor tell what is running. Pin the sha instead. This applies
  # to the migrate Job as well as the Deployment, so both run identical code — a
  # migration from a different build than the app is a bad surprise.
  - name: ghcr.io/thetaskmaster42/prep-tracker
    newTag: "45e502b"

patches:
  - path: patches/deployment.yaml

  # --- ordering ---------------------------------------------------------
  # migrate-job.yaml ships as an ArgoCD PreSync hook, which deadlocks. PreSync
  # runs BEFORE the main sync, but the Job needs secret `prep-tracker-db-app`,
  # which the CloudNativePG operator creates only once the Cluster exists — and
  # the Cluster is a main-sync resource. PreSync therefore waits forever for
  # something PreSync itself prevents. Symptom: the Job pod sits in
  # CreateContainerConfigError, secret "prep-tracker-db-app" not found.
  #
  # Moving the Job into the ordinary sync and ordering by wave gives what the
  # hook was reaching for. Sync waves DO order resources within one Application
  # (unlike across Applications, where they are inert):
  #
  #   wave 0  Cluster      default; the operator then publishes the secret
  #   wave 1  migrate Job  schema
  #   wave 2  Deployment   new pods
  #
  # The upstream fix is better: give the Cluster a lower sync-wave in the app
  # repo, or let the Job tolerate a missing secret and retry.
  - target:
      kind: Job
      name: prep-tracker-migrate
    patch: |-
      - op: remove
        path: /metadata/annotations/argocd.argoproj.io~1hook
      - op: remove
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
      # A Job spec is immutable, so a changed migration cannot be patched in
      # place. Replace lets ArgoCD recreate it rather than fail the sync.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Replace=true

  - target:
      kind: Deployment
      name: prep-tracker
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
