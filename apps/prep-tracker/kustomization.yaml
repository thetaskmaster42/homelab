apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interview

resources:
  # The app repo owns its own Deployment/Service/PVC; this overlay only pins and
  # exposes them. Each file is pinned to a commit sha, so a push to the app repo
  # cannot silently change what runs here — bumping these refs is the promotion
  # event, and it shows up as a reviewable diff.
  #
  # These are per-file URLs rather than a `//k8s?ref=` directory base because the
  # app repo's k8s/ has no kustomization.yaml. Adding one upstream would let this
  # collapse to a single line; until then, per-file is the way that works without
  # reaching into another repo.
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/40754fd335ae667b4a60d7b4db41d6e4ce72cac3/k8s/deployment.yaml
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/40754fd335ae667b4a60d7b4db41d6e4ce72cac3/k8s/service.yaml
  - https://raw.githubusercontent.com/thetaskmaster42/prep-tracker/40754fd335ae667b4a60d7b4db41d6e4ce72cac3/k8s/pvc.yaml
  - ingress.yaml

images:
  # The base ships `:latest` with imagePullPolicy: Always, which means you can
  # neither roll back nor tell what is running. Pin the sha here instead.
  - name: ghcr.io/thetaskmaster42/prep-tracker
    newTag: "40754fd"

patches:
  - path: patches/deployment.yaml
