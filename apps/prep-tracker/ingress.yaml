# Tailnet-only exposure. ingressClassName "tailscale" is provided by the
# tailscale-operator infra service; it registers a node on the tailnet and
# serves this app at https://prep-tracker.tailcb5a3f.ts.net with a real
# Let's Encrypt certificate.
#
# This app is deliberately NOT funneled — it holds interview prep notes and has
# no authentication. Making it public would require adding auth first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prep-tracker
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: prep-tracker
      port:
        number: 80
  tls:
    - hosts:
        - prep-tracker
