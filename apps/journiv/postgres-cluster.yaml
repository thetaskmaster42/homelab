# Journiv's database. PostgreSQL rather than the SQLite default: upstream
# recommends it for production, and the alternative is a single file on a shared
# NFS volume that three pods (app, celery-worker, celery-beat) all open at once —
# which SQLite does not survive.
#
# CloudNativePG generates the credentials and publishes them as the Secret
# `journiv-db-app`; nobody chooses this password and nobody writes it down. That
# is the shape ADR 0014 names as preferred, and the reason nothing about the
# database appears in the bootstrap bundle.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: journiv-db
  labels:
    app: journiv
spec:
  # ONE instance, deliberately. Three was HA theatre here: every replica's
  # volume lives on the same NAS, so `portal` going away takes the whole cluster
  # regardless, and a k3s-server blackhole removes the API server and restarts
  # all of them together anyway -- which is what ~1,900 accumulated postgres
  # restarts actually recorded.
  #
  # What replicas buy is seconds-of-failover on node loss. What they do NOT buy
  # is protection from a bad migration, a wrong DELETE, or a corrupt page -- all
  # of which replicate instantly to every copy. Those need backups, which is
  # where the freed capacity is going (barman -> S3).
  #
  # Availability is not zero at one instance: the PVC is RWO but the volume is
  # NFS, so the pod reschedules onto another node and reattaches. That is minutes
  # of downtime on node loss instead of seconds, and no data loss.
  #
  # See docs/decisions/0020-one-postgres-per-app.md.
  instances: 1
  primaryUpdateStrategy: unsupervised

  storage:
    size: 5Gi
    # Explicit, and not negotiable: local-path and nfs are BOTH marked default,
    # so an omitted class resolves to whichever was created last and differs
    # between rebuilds. Journal entries on node-local disk would be erased by the
    # next `homelab nuke` with no error anywhere. tests/test_apps.py enforces it.
    storageClass: nfs

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

  bootstrap:
    initdb:
      database: journiv
      owner: journiv
