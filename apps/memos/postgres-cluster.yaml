# Memos defaults to SQLite, and this cluster is the reason not to take that
# default: SQLite's own guidance is to avoid network filesystems, and `nfs` is
# where application data lives here. A SQLite Memos would have to sit on
# local-path (node-pinned, erased by `homelab nuke`) or a /srv hostPath (the
# opengym pattern — one SD card, nothing backed up).
#
# Postgres costs nothing extra: CloudNativePG is already running, so this is one
# CR, and the operator generates the credential as `memos-db-app`. Nobody
# chooses that password and nobody writes it down, which is the shape ADR 0014
# names as preferred and the reason Memos needs no bootstrap secret at all.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: memos-db
  labels:
    app: memos
spec:
  # ONE instance, deliberately. Three was HA theatre here: every replica's
  # volume lives on the same NAS, so `portal` going away takes the whole cluster
  # regardless, and a k3s-server blackhole removes the API server and restarts
  # all of them together anyway -- which is what ~1,900 accumulated postgres
  # restarts actually recorded.
  #
  # What replicas buy is seconds-of-failover on node loss. What they do NOT buy
  # is protection from a bad migration, a wrong DELETE, or a corrupt page -- all
  # of which replicate instantly to every copy. Those need backups, which is
  # where the freed capacity is going (barman -> S3).
  #
  # Availability is not zero at one instance: the PVC is RWO but the volume is
  # NFS, so the pod reschedules onto another node and reattaches. That is minutes
  # of downtime on node loss instead of seconds, and no data loss.
  #
  # See docs/decisions/0020-one-postgres-per-app.md.
  instances: 1
  primaryUpdateStrategy: unsupervised

  storage:
    # 5Gi rather than the 1Gi the notes themselves would need. Memos stores
    # attachments IN THE DATABASE by default rather than on disk, so image
    # uploads grow this volume, not the data PVC below.
    size: 5Gi
    # Explicit, always. local-path and nfs are both marked default, so an
    # omitted class resolves to whichever was created last and differs between
    # rebuilds. tests/test_apps.py fails the build without it.
    storageClass: nfs

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

  bootstrap:
    initdb:
      database: memos
      owner: memos
