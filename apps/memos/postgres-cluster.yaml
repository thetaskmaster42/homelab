# Memos defaults to SQLite, and this cluster is the reason not to take that
# default: SQLite's own guidance is to avoid network filesystems, and NFS is
# where application data lives here. A SQLite Memos would have to sit on
# local-path (node-pinned, erased by `homelab nuke`) or a /srv hostPath (the
# opengym pattern — one SD card, nothing backed up).
#
# Postgres costs nothing extra: CloudNativePG is already running, so this is one
# CR, and the operator generates the credential as `memos-pg-app`. Nobody
# chooses that password and nobody writes it down, which is the shape ADR 0014
# names as preferred and the reason Memos needs no bootstrap secret at all.
#
# Named memos-pg, not memos-db: this cluster replaced memos-db on 2026-10-27 by
# being RECOVERED from memos-db's barman backup onto TrueNAS (ADR 0021 phase 3).
# A storage class cannot be changed in place, so the move was a second Cluster,
# a cutover, then deleting the first -- which also made it the first restore
# test of the Garage backups.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: memos-pg
  labels:
    app: memos
spec:
  # ONE instance, deliberately. Three was HA theatre here: every replica's
  # volume lives on the same NAS, so losing the NAS takes the whole cluster
  # regardless, and a k3s-server blackhole removes the API server and restarts
  # all of them together anyway -- which is what ~1,900 accumulated postgres
  # restarts actually recorded.
  #
  # What replicas buy is seconds-of-failover on node loss. What they do NOT buy
  # is protection from a bad migration, a wrong DELETE, or a corrupt page -- all
  # of which replicate instantly to every copy. That is what backup.yaml is for.
  #
  # Availability is not zero at one instance: the PVC is RWO but the volume is
  # NFS, so the pod reschedules onto another node and reattaches. That is minutes
  # of downtime on node loss instead of seconds, and no data loss.
  #
  # See docs/decisions/0020-one-postgres-per-app.md.
  instances: 1
  primaryUpdateStrategy: unsupervised

  storage:
    # 5Gi rather than the 1Gi the notes themselves would need. Memos stores
    # attachments IN THE DATABASE by default rather than on disk, so image
    # uploads grow this volume, not the data PVC.
    size: 5Gi
    # Explicit, always. local-path and nfs are both marked default, so an
    # omitted class resolves to whichever was created last and differs between
    # rebuilds. tests/test_apps.py fails the build without it.
    storageClass: truenas

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

  # Read only when the Cluster is first created; inert on a running cluster.
  # So it matters exactly once more: after `homelab nuke && homelab install`,
  # this recreates memos-pg from its own latest backup instead of an empty
  # initdb. That rebuild then needs the archiver's serverName below bumped
  # (memos-pg -> memos-pg-2), because barman refuses to archive into a prefix
  # that already holds WAL -- until then the data is back but
  # ContinuousArchiving reports False.
  bootstrap:
    recovery:
      source: memos-backup
      database: memos
      owner: memos

  externalClusters:
    - name: memos-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: memos-backups
          # This cluster's own archive. It was memos-db (the old cluster)
          # for the one-off recovery; s3://cnpg-backups/memos/memos-db/ now
          # holds only that frozen history.
          serverName: memos-pg

  # Continuous WAL archiving through the Barman Cloud plugin (backup.yaml has
  # the ObjectStore and the daily base backup).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: memos-backups
        serverName: memos-pg
