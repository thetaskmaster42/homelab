# Backups for memos-pg: continuous WAL archiving plus a daily base backup, to
# Garage on TrueNAS. Together they allow point-in-time recovery to any moment
# inside the retention window -- which is what a bad migration or a wrong
# DELETE actually needs, and what the replicas removed by ADR 0020 never gave.
#
# The credential is the bootstrap secret `garage-cnpg-backups`, copied into
# every namespace that backs up (an ObjectStore cannot read across namespaces).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: memos-backups
spec:
  # Base backups and the WAL needed to recover from them are pruned together
  # past this point. 30 days is generous for data this size (tens of MB) and
  # costs nothing against a 7 TiB pool.
  retentionPolicy: "30d"
  configuration:
    # One prefix per app inside the shared bucket. Never reuse a prefix for a
    # different cluster: barman refuses to archive into a path that already
    # holds another server's WAL, and a restored cluster must write to a NEW
    # prefix for the same reason.
    destinationPath: s3://cnpg-backups/memos
    # Garage's S3 API as published by the TrueNAS app. Plain HTTP on the LAN;
    # addressed by IP, so botocore uses path-style requests automatically.
    endpointURL: http://192.168.11.4:30188
    s3Credentials:
      accessKeyId:
        name: garage-cnpg-backups
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: garage-cnpg-backups
        key: ACCESS_SECRET_KEY
      # Garage rejects request signatures for any region but its own
      # (`s3_region`, "garage" by default) -- botocore's us-east-1 default fails.
      region:
        name: garage-cnpg-backups
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: memos-db-daily
spec:
  # Six fields -- CloudNativePG's cron has SECONDS first: 03:00 daily. Give any
  # other app that backs up a different minute, so base backups never hit the
  # NAS at the same time.
  schedule: "0 0 3 * * *"
  # Take one now rather than waiting for 03:00: until the first base backup
  # exists, archived WAL has nothing to replay onto.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: memos-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
